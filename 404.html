<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#071d2d" />
    <title>Page not found — Ritvoo</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-white-32.png" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; margin: 0; color: #fffefa; background: #071d2d; font: 16px/1.65 Arial, sans-serif; }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px max(24px, calc((100vw - 1160px) / 2)); }
      header { border-bottom: 1px solid rgba(255,255,255,.16); }
      header img { width: 128px; height: auto; }
      a { color: inherit; }
      main { display: grid; align-content: center; justify-items: start; width: min(1160px, calc(100% - 48px)); margin: auto; padding: 100px 0; }
      .eyebrow { color: #b29af7; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 20px 0; font-size: clamp(52px, 9vw, 104px); font-weight: 500; letter-spacing: -.07em; line-height: .98; }
      p { max-width: 520px; color: rgba(255,254,250,.74); }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
      nav a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 17px; border: 1px solid rgba(255,255,255,.35); text-decoration: none; }
      nav a:first-child { color: #071d2d; background: #fffefa; }
      nav a:hover, nav a:focus-visible { outline: 3px solid #b29af7; outline-offset: 3px; }
      footer { color: rgba(255,254,250,.68); font-size: 12px; }
      @media (max-width: 560px) { header, footer { padding: 20px 24px; } main { padding: 68px 0; } footer { align-items: flex-start; flex-direction: column; gap: 4px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <header><a href="/" aria-label="Ritvoo home"><img src="/favicon-white-96.png" alt="Ritvoo" /></a><a href="/contact">Talk to us</a></header>
    <main>
      <span class="eyebrow">Error 404 · Page not found</span>
      <h1>Looks like this page took a wrong turn.</h1>
      <p>The link may be out of date, or the address may have a typo. Try one of these useful places instead.</p>
      <nav aria-label="Suggested pages"><a href="/">Go to homepage</a><a href="/service">Explore services</a><a href="/contact">Contact Ritvoo</a></nav>
    </main>
    <footer><span>© Ritvoo</span><a href="/privacy">Privacy</a></footer>
  </body>
</html>
